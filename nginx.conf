server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # =====================================================
    # Assets de Vite con hash
    # Ejemplo: /assets/index-abc123.js
    # Se pueden cachear fuerte porque cambian de nombre
    # en cada build.
    # =====================================================
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # =====================================================
    # index.html NO debe cachearse
    # Esto evita pantalla negra por archivos JS viejos
    # después de un deploy.
    # =====================================================
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # =====================================================
    # React Router / SPA fallback
    # /admin, /clientes, /vendedor, etc.
    # =====================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}